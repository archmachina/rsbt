---

name: test
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: "test"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: python setup
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: test
        shell: bash
        run: |
          ./entrypoint test
